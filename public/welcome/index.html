<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Welcome to the Spurgeon's Centre</title>
  <meta name="description" content="Sign in at the Spurgeon's Centre to work on site." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="kiosk-head">
      <img class="logo" src="/logo.svg" alt="Kharis Church" width="56" height="56" />
      <h1>Welcome to the Spurgeon's Centre</h1>
      <p>Please sign in.</p>
    </header>

    <div class="hub-single">
      <a class="tile tile--work" href="/workers">
        <span class="tile-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1Z"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M4 15v-3a6 6 0 0 1 6-6"/><path d="M14 6a6 6 0 0 1 6 6v3"/></svg>
        </span>
        <span class="tile-title">Sign in to work</span>
        <span class="tile-sub">Kharis workers &amp; contractors sign in to the site register.</span>
        <span class="tile-go">Sign in <span aria-hidden="true">&rarr;</span></span>
      </a>
    </div>

    <p class="foot">Kharis Church Spurgeon's Centre</p>
  </main>
</body>
</html>
